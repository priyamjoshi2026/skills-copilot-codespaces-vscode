<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moon Phase Tracker</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 2rem;
      line-height: 1.5;
    }
    .card {
      max-width: 32rem;
      border: 1px solid #d0d7de;
      border-radius: 0.5rem;
      padding: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      border-bottom: 1px solid #d0d7de;
      text-align: left;
      padding: 0.5rem 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Moon Phase Tracker</h1>
    <label for="date">Choose a date:</label>
    <input id="date" name="date" type="date">
    <p id="current-phase"></p>

    <h2>Next 7 days</h2>
    <table>
      <thead>
        <tr><th>Date</th><th>Phase</th></tr>
      </thead>
      <tbody id="forecast"></tbody>
    </table>
  </main>

  <script src="./moon-phase.js"></script>
</body>
</html>
